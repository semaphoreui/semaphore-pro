version: '3.8'

services:
  semaphore-server:
    image: semaphoreui/semaphore:v2.10.0-pro
    container_name: semaphore-server
    environment:
      # Database configuration
      SEMAPHORE_DB_HOST: postgres
      SEMAPHORE_DB_NAME: semaphore
      SEMAPHORE_DB_USER: semaphore
      SEMAPHORE_DB_PASS: semaphore123
      
      # Admin user
      SEMAPHORE_ADMIN_PASSWORD: admin123
      SEMAPHORE_ADMIN_NAME: admin
      SEMAPHORE_ADMIN_EMAIL: admin@example.com
      
      # Server-side cloning configuration
      SEMAPHORE_SERVER_SIDE_CLONING: "true"
      SEMAPHORE_CLONE_STORAGE_PATH: "/app/clone-cache"
      SEMAPHORE_CLONE_MAX_SIZE: "2GB"
      SEMAPHORE_CLONE_CLEANUP_INTERVAL: "15m"
      SEMAPHORE_CLONE_DEFAULT_TTL: "1h"
      SEMAPHORE_CLONE_MAX_CONCURRENT: "5"
      SEMAPHORE_CLONE_RATE_LIMIT: "10"
      
      # Security settings
      SEMAPHORE_CLONE_ALLOWED_HOSTS: "github.com,gitlab.com,bitbucket.org"
      SEMAPHORE_CLONE_AUDIT_LOGGING: "true"
      
    volumes:
      - semaphore-data:/var/lib/semaphore
      - clone-cache:/app/clone-cache
      - ./config:/etc/semaphore:ro
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - semaphore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  semaphore-runner-1:
    image: semaphoreui/runner:v2.10.0-pro
    container_name: semaphore-runner-1
    environment:
      SEMAPHORE_SERVER_URL: http://semaphore-server:3000
      SEMAPHORE_RUNNER_TOKEN: "runner-token-123"
      SEMAPHORE_RUNNER_CLONING_MODE: "server_side"
      SEMAPHORE_RUNNER_FALLBACK_DIRECT: "false"
      SEMAPHORE_RUNNER_CLONE_TIMEOUT: "300s"
      SEMAPHORE_RUNNER_MAX_RETRIES: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-1-workspace:/workspace
    depends_on:
      - semaphore-server
    networks:
      - semaphore-network
    restart: unless-stopped

  semaphore-runner-2:
    image: semaphoreui/runner:v2.10.0-pro
    container_name: semaphore-runner-2
    environment:
      SEMAPHORE_SERVER_URL: http://semaphore-server:3000
      SEMAPHORE_RUNNER_TOKEN: "runner-token-456"
      SEMAPHORE_RUNNER_CLONING_MODE: "server_side"
      SEMAPHORE_RUNNER_FALLBACK_DIRECT: "false"
      SEMAPHORE_RUNNER_CLONE_TIMEOUT: "300s"
      SEMAPHORE_RUNNER_MAX_RETRIES: "3"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-2-workspace:/workspace
    depends_on:
      - semaphore-server
    networks:
      - semaphore-network
    restart: unless-stopped

  postgres:
    image: postgres:14
    container_name: postgres
    environment:
      POSTGRES_DB: semaphore
      POSTGRES_USER: semaphore
      POSTGRES_PASSWORD: semaphore123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - semaphore-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U semaphore"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis-data:/data
    networks:
      - semaphore-network
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  semaphore-data:
    driver: local
  clone-cache:
    driver: local
  runner-1-workspace:
    driver: local
  runner-2-workspace:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  semaphore-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16